name: Deploy site

on:
  push:
    branches: [main]
  # Una vez al día, para refrescar los datos reales de GitHub del demo.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; uno nuevo no cancela al que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # npm 10 falla con este lockfile (bug de arborist con el peer opcional de jsdom).
      - run: npx --yes npm@11 ci
      - run: npm test
      # Refresca los datos del demo; si GitHub no responde, conserva los del repositorio.
      - run: npm run data
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages no conoce las rutas de la SPA: 404.html carga la app en cualquier ruta.
      - run: cp apps/site/dist/index.html apps/site/dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
