<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contrib/graphs</title>
    <meta name="description" content="Seven React components that show your GitHub, GitLab or any other activity as a calendar heatmap. Install them from npm or copy them with the shadcn CLI." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var m = localStorage.getItem('cg-site-mode')
        if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m
      } catch (e) {}
      // Idioma: inglés en la raíz, español en /es. Se respeta la elección guardada;
      // en la primera visita se usa el idioma del navegador. Corre antes de cargar la app.
      try {
        // Rutas relativas a la base del sitio ('/' en local, '/contrib-graphs/' en GitHub Pages).
        var base = '%BASE_URL%'.replace(/\/$/, '')
        var path = location.pathname.slice(base.length) || '/'
        var isEs = path === '/es' || path.indexOf('/es/') === 0
        var saved = null
        try { saved = localStorage.getItem('cg-site-lang') } catch (e) {}
        var wanted = saved || ((navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en')
        if (wanted === 'es' && !isEs) location.replace(base + '/es' + (path === '/' ? '' : path) + location.search + location.hash)
        else if (saved === 'en' && isEs) location.replace(base + (path.slice(3) || '/') + location.search + location.hash)
        document.documentElement.lang = isEs ? 'es' : 'en'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
